# =============================================================================
# Alertmanager Configuration — Toxic Comment Platform
# =============================================================================

global:
  resolve_timeout: 5m # Time to wait before declaring an alert resolved

# -----------------------------------------------------------------------
# Inhibition rules — suppress lower-severity alerts when a critical one fires
# -----------------------------------------------------------------------
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "instance"]

# -----------------------------------------------------------------------
# Templates
# -----------------------------------------------------------------------
templates: []

# -----------------------------------------------------------------------
# Routing tree
# -----------------------------------------------------------------------
route:
  # Default grouping: group alerts by name + instance so one notification
  # is sent per unique (alert, host) pair, not one per label combination.
  group_by: ["alertname", "instance", "severity"]
  group_wait: 30s # Wait before sending the first notification
  group_interval: 5m # Wait before sending a changed group
  repeat_interval: 4h # Re-notify if the alert is still firing
  receiver: discord-critical

  routes:
    # Critical alerts: notify immediately
    - matchers:
        - severity="critical"
      receiver: discord-critical
      repeat_interval: 1h

    # Warning alerts: slightly delayed, less frequent
    - matchers:
        - severity="warning"
      receiver: discord-warning
      group_wait: 1m
      repeat_interval: 6h

# -----------------------------------------------------------------------
# Receivers
# -----------------------------------------------------------------------
receivers:
  - name: discord-critical
    discord_configs:
      - webhook_url: "https://discordapp.com/api/webhooks/1522198272612241479/T81zw_bc6qt_vhFBEHoIHUzlmTJZUsl_VgA6eLKv-_qdEmcqw5zd8NSyYlg9YFUvzto0"
        title: |
          🔴 [CRITICAL] {{ .GroupLabels.alertname }}
        message: |
          {{ range .Alerts }}
          **Instance:** {{ .Labels.instance }}
          **Summary:** {{ .Annotations.summary }}
          **Detail:** {{ .Annotations.description }}
          **Since:** {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}
        send_resolved: true

  - name: discord-warning
    discord_configs:
      - webhook_url: "https://discordapp.com/api/webhooks/1522198272612241479/T81zw_bc6qt_vhFBEHoIHUzlmTJZUsl_VgA6eLKv-_qdEmcqw5zd8NSyYlg9YFUvzto0"
        title: |
          🟡 [WARNING] {{ .GroupLabels.alertname }}
        message: |
          {{ range .Alerts }}
          **Instance:** {{ .Labels.instance }}
          **Summary:** {{ .Annotations.summary }}
          **Detail:** {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
