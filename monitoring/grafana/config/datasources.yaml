apiVersion: 1

# Remove stale datasources on restart
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s" # Match global scrape_interval
      queryTimeout: "60s"
      httpMethod: POST # POST is more efficient for large queries
      prometheusType: Prometheus
      prometheusVersion: "2.51.0"
      cacheLevel: "High"
      incrementalQuerying: true
      exemplarTraceIdDestinations: []
