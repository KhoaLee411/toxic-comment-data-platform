apiVersion: 1

providers:
  - name: "toxic-platform-dashboards"
    orgId: 1
    type: file
    disableDeletion: false # Allow removing dashboards from disk
    updateIntervalSeconds: 30 # Poll for changes every 30s
    allowUiUpdates: true # Allow UI edits (changes saved back to disk)
    options:
      path: /opt/grafana/dashboards
      foldersFromFilesStructure: true # Sub-folders on disk → folders in Grafana
