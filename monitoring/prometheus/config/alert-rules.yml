groups:
  # =========================================================================
  # Host / Node alerts
  # =========================================================================
  - name: host_alerts
    rules:
      - alert: HostOutOfMemory
        expr: |
          node_memory_MemAvailable_bytes
          / node_memory_MemTotal_bytes * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host out of memory ({{ $labels.instance }})"
          description: "Available memory is {{ humanize $value }}%. Below 10% threshold."

      - alert: HostMemoryCritical
        expr: |
          node_memory_MemAvailable_bytes
          / node_memory_MemTotal_bytes * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host memory critically low ({{ $labels.instance }})"
          description: "Available memory is {{ humanize $value }}%. Below 5% — OOM imminent."

      - alert: HostHighCPU
        expr: |
          100 - (avg by(instance) (
            rate(node_cpu_seconds_total{mode="idle"}[2m])
          ) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load ({{ $labels.instance }})"
          description: "CPU usage is {{ humanize $value }}% (threshold: 80%)."

      - alert: HostCPUCritical
        expr: |
          100 - (avg by(instance) (
            rate(node_cpu_seconds_total{mode="idle"}[2m])
          ) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU overloaded ({{ $labels.instance }})"
          description: "CPU usage is {{ humanize $value }}% — system may become unresponsive."

      - alert: HostDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space ({{ $labels.instance }}:{{ $labels.mountpoint }})"
          description: "Only {{ humanize $value }}% disk space remaining."

      - alert: HostDiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|devtmpfs|squashfs"}
          ) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critical ({{ $labels.instance }}:{{ $labels.mountpoint }})"
          description: "Only {{ humanize $value }}% disk space remaining — writes may fail."

      - alert: HostDiskReadLatencyHigh
        expr: |
          rate(node_disk_read_time_seconds_total[1m])
          / rate(node_disk_reads_completed_total[1m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk read latency ({{ $labels.instance }})"
          description: "Disk {{ $labels.device }} average read latency: {{ humanize $value }}s."

      - alert: HostNetworkReceiveErrors
        expr: |
          rate(node_network_receive_errs_total[2m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network receive errors ({{ $labels.instance }})"
          description: "Interface {{ $labels.device }} has {{ humanize $value }} receive errors/s."

      - alert: HostSystemLoad15mHigh
        expr: |
          node_load15
          / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High system load ({{ $labels.instance }})"
          description: "15-minute load average per core is {{ humanize $value }} (threshold: 1.5)."

  # =========================================================================
  # Container / cAdvisor alerts
  # =========================================================================
  - name: container_alerts
    rules:
      - alert: ContainerHighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""}
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container high memory ({{ $labels.name }})"
          description: "Container {{ $labels.name }} uses {{ humanize $value }}% of its memory limit."

      - alert: ContainerCPUThrottling
        expr: |
          rate(container_cpu_cfs_throttled_seconds_total{name!=""}[5m])
          / rate(container_cpu_cfs_periods_total{name!=""}[5m]) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU throttled ({{ $labels.name }})"
          description: "Container {{ $labels.name }} is being CPU-throttled {{ humanize $value }}% of the time."

      - alert: ContainerRestarting
        expr: |
          increase(container_restart_count{name!=""}[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container restarting frequently ({{ $labels.name }})"
          description: "Container {{ $labels.name }} restarted {{ $value }} times in the last 15 minutes."

  # =========================================================================
  # Prometheus self-monitoring
  # =========================================================================
  - name: prometheus_alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target is down ({{ $labels.job }}/{{ $labels.instance }})"
          description: "Prometheus cannot reach {{ $labels.instance }} for job '{{ $labels.job }}'."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed"
          description: "Prometheus failed to reload its configuration. Check for YAML syntax errors."
