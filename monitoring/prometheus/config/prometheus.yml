global:
  scrape_interval: 15s # How often to scrape targets by default
  evaluation_interval: 15s # How often to evaluate alerting rules
  scrape_timeout: 10s # Scrape timeout (must be <= scrape_interval)
  external_labels:
    monitor: "toxic-platform"
    environment: "production"

# -----------------------------------------------------------------------
# Rule files — alert-rules.yml is loaded at startup and re-evaluated
# -----------------------------------------------------------------------
rule_files:
  - alert-rules.yml

# -----------------------------------------------------------------------
# Alertmanager integration
# -----------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      timeout: 10s
      api_version: v2

# -----------------------------------------------------------------------
# Scrape configurations
# -----------------------------------------------------------------------
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "prometheus"

  # Node Exporter — host-level metrics
  - job_name: "node"
    scrape_interval: 10s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "platform-host"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "platform-host"

  # cAdvisor — per-container metrics
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop high-cardinality metrics we don't need
      - source_labels: [__name__]
        regex: "container_(tasks_state|memory_failures_total)"
        action: drop
      # Keep only running containers (skip empty name/pause containers)
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop
