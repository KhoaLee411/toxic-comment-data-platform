input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON log messages if present
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "logs-%{+YYYY.MM.dd}"
    action => "create"
  }
}