version: 2

models:
  - name: transform_table_clean
    description: >
      Cleaned and type-cast toxic comment dataset.
      Reads from staging.text_comment_1, converts PostgreSQL native integer arrays
      to JSONB format, filters invalid/null rows, and writes to production.table_clean.
    columns:
      - name: labels
        description: "Binary toxicity label: 0 = non-toxic, 1 = toxic."
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: [0, 1]
              quote_values: false

      - name: input_ids
        description: "JSONB array of BERT token IDs. e.g. [101, 2023, 1010]"
        data_type: jsonb
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_not_be_null

      - name: attention_mask
        description: "JSONB array of attention mask values (0 or 1). e.g. [1, 1, 0]"
        data_type: jsonb
        tests:
          - not_null

      - name: dbt_loaded_at
        description: "Timestamp when this row was processed by dbt."
        data_type: timestamptz
        tests: []

    config:
      contract:
        enforced: true