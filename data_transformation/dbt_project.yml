name: 'data_transformation'
version: '1.0.0'
config-version: 2

profile: 'data_transformation'

model-paths: ["models"]
test-paths: ["tests"]
# Uncomment below when directories are added:
# analysis-paths: ["analyses"]
# seed-paths: ["seeds"]
# macro-paths: ["macros"]
# snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_transformation:
    +materialized: table
    transform:
      +schema: production   # models/transform/ → writes to `production` schema